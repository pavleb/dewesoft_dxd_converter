[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dewesoft-dxd-converter"
version = "0.1.2"
description = "Pure Python library to convert Dewesoft .dxd and .dxz files without vendor libraries."
readme = "README.md"
requires-python = ">=3.13"

authors = [
    {name = "Pavle Boškoski"}
]

dependencies = [
    "hatch>=1.16.5",
    "numpy>=2.4.4",
    "pytest>=9.1.1",
    "tqdm>=4.67.3",
]

classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/pavleb/dewesoft_dxd_converter"
Issues = "https://github.com/pavleb/dewesoft_dxd_converter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dewesoft_dxd_converter"]
